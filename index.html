<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Audio Message</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f5f5f2;
      color: #242424;
    }

    .player {
      width: 100%;
      max-width: 360px;
      padding: 24px;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
    }

    .cover {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
      border-radius: 16px;
      margin-bottom: 24px;
      background: #eeeeea;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 24px;
      font-weight: 600;
    }

    .subtitle {
      margin: 0 0 24px;
      color: #777777;
      font-size: 14px;
    }

    .timeline {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      color: #777777;
      font-size: 12px;
    }

    #progress {
      width: 100%;
      accent-color: #292929;
      cursor: pointer;
    }

    .controls {
      display: flex;
      justify-content: center;
      margin-top: 24px;
    }

    #playButton {
      width: 60px;
      height: 60px;
      border: none;
      border-radius: 50%;
      background: #242424;
      color: #ffffff;
      font-size: 22px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    #playButton:hover {
      background: #444444;
    }

    #playButton:focus-visible {
      outline: 3px solid #888888;
      outline-offset: 4px;
    }

    #playButton:disabled {
      background: #999999;
      cursor: not-allowed;
    }

    #status {
      margin: 16px 0 0;
      text-align: center;
      color: #777777;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <main class="player">

    <!-- Each person has a unique cover image -->
    <img
      id="cover"
      class="cover"
      src="covers/Carl.jpg"
      alt="Carl's audio cover"
    >

    <h1 id="personName">Carl</h1>
    <p class="subtitle">Your audio message</p>

    <!-- Audio file is selected by script.js -->
    <audio id="audio" preload="metadata"></audio>

    <!-- Audio playback timeline -->
    <div class="timeline">
      <span id="currentTime">0:00</span>
      <span id="duration">0:00</span>
    </div>

    <input
      id="progress"
      type="range"
      min="0"
      max="100"
      value="0"
      step="0.1"
      aria-label="Audio progress"
    >

    <!-- Play and pause control -->
    <div class="controls">
      <button
        id="playButton"
        type="button"
        aria-label="Play audio"
      >▶</button>
    </div>

    <p id="status" role="status" aria-live="polite">
      Tap play to listen
    </p>

  </main>

  <script src="script.js"></script>
</body>
</html>
